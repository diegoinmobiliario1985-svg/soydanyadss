<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Dany Ads</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<main class="login-page">
  <div style="position:relative;">
    <a href="/" class="back-home">← Volver al inicio</a>

    <div class="login-box">
      <a href="/" class="login-logo">Dany Ads</a>
      <p class="login-subtitle">Área exclusiva de estudiantes</p>
      <h2 class="login-title">Accede a tu curso</h2>

      <!-- Mensaje de error -->
      <div class="form-error" id="login-error"></div>

      <!-- Formulario de login -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
              style="padding-right:48px;"
            />
            <button
              type="button"
              id="toggle-pass"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;color:var(--text-muted);font-size:18px;padding:0;"
              title="Mostrar/ocultar contraseña"
            >👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn" style="margin-top:8px;">
          <span id="login-text">Entrar a mi curso</span>
          <span id="login-spinner" style="display:none;">⏳ Verificando...</span>
        </button>
      </form>

      <div class="login-footer" style="margin-top:20px;">
        <a href="/forgot-password.html" id="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Separador -->
      <div style="border-top:1px solid var(--border);margin:24px 0;"></div>

      <div class="login-footer">
        ¿No tienes cuenta aún?
        <a href="/#workshops" style="color:var(--blue);margin-left:4px;">Ver workshops →</a>
      </div>
    </div>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════
   JAVASCRIPT — LOGIN PAGE
   ═══════════════════════════════════════════════════════ */

// Redirigir si ya hay sesión activa
const tokenGuardado = localStorage.getItem('dany_ads_token');
if (tokenGuardado) {
  window.location.href = '/dashboard.html';
}

// Toggle de contraseña
document.getElementById('toggle-pass').addEventListener('click', () => {
  const input = document.getElementById('password');
  const btn = document.getElementById('toggle-pass');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
});

// Submit del formulario
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('login-error');

  const mostrarError = (msg) => {
    errorDiv.textContent = msg;
    errorDiv.classList.add('visible');
  };
  const ocultarError = () => errorDiv.classList.remove('visible');

  // Validar
  ocultarError();
  if (!email || !password) {
    return mostrarError('Por favor completa todos los campos.');
  }

  // Estado de carga
  const btn = document.getElementById('login-btn');
  document.getElementById('login-text').style.display = 'none';
  document.getElementById('login-spinner').style.display = 'inline';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Error al iniciar sesión.');
    }

    // Guardar token y datos del usuario
    localStorage.setItem('dany_ads_token', data.token);
    localStorage.setItem('dany_ads_user', JSON.stringify(data.usuario));

    // Redirigir según el rol
    if (data.usuario.role === 'admin') {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/dashboard.html';
    }

  } catch (err) {
    mostrarError(err.message);
  } finally {
    document.getElementById('login-text').style.display = 'inline';
    document.getElementById('login-spinner').style.display = 'none';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
